name: Release

# Tag-driven, matching the other published Foundry packages: bump the version,
# merge, then push `v<version>`. The job refuses a tag that disagrees with
# package.json rather than publishing something nobody named.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        # The job only reads the repo. Leaving the token in the local git config
        # would leave it there while third-party package scripts run.
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Node 22 is what trusted publishing will need. npm is deliberately
          # NOT upgraded past what Node ships: npm 11 refuses a granular token
          # that bypasses two-factor auth for direct publishing, and reports the
          # refusal as a bare 404 on the PUT. Upgrading to npm 11 ahead of the
          # switch is what broke this job's first two attempts.
          node-version: 22
          cache: npm

      # Checked before anything is built. A release that discovers its missing
      # credential at the publish step has already spent three minutes and
      # reports it as a failure of the package rather than of its setup.
      # Two ways to authenticate, and the job takes whichever is configured.
      # A token is needed for the first publish, because a trusted publisher is
      # configured in a package's settings and the package has to exist first.
      # After that, this repo can be added as a trusted publisher on npmjs.com
      # and the secret deleted — OIDC mints a credential per run that expires in
      # minutes, which is the only kind that cannot be leaked or go stale.
      - name: Authenticate to the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            npm config set //registry.npmjs.org/:_authToken '${NODE_AUTH_TOKEN}'
            echo "Publishing with the release token."
          else
            echo "No NPM_TOKEN set — relying on trusted publishing (OIDC)."
            echo "If this repo is not yet a trusted publisher for the package, the publish below will fail." >&2
          fi

      - name: Tag must match package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}" >&2
            exit 1
          fi

      - run: npm ci
      - name: Verify before publishing
        run: |
          set -euo pipefail
          npm run check-types
          npm test
          npm run build

      # Re-running a tag must not fail on work already done. npm refuses to
      # replace a published version, which is correct and is not a reason for a
      # release to go red.
      - name: Publish if this version is new
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # Asked of the version document, not through `npm view`. A freshly
          # published package answers on its version endpoint immediately while
          # its full packument stays uncached for some minutes, and `npm view`
          # reads the packument — so right after a release it reports a version
          # that plainly exists as missing, and the job publishes into a name
          # that already has it.
          ENCODED=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$ENCODED/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "$NAME@$VERSION is already on the registry; nothing to publish."
            exit 0
          fi
          # Published without provenance, and that is a stopgap worth naming.
          # Provenance requires an attested publish, which npm refuses for a
          # granular token that bypasses two-factor auth — it answers the PUT
          # with a bare 404 that reads like a permissions problem. The same
          # refusal is what npm 11 applies to direct publishing generally.
          #
          # The fix is trusted publishing: no token, an OIDC credential minted
          # per run, and provenance for free. It is configured in the package's
          # settings on npmjs.com. When that is switched on, delete the
          # NPM_TOKEN secret, add `npm install -g npm@^11` above, and restore
          # `--provenance` here.
          npm publish --access public
