name: Release

# Tag-driven, matching the other published Foundry packages: bump the version,
# merge, then push `v<version>`. The job refuses a tag that disagrees with
# package.json rather than publishing something nobody named.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $tagged does not match package.json $declared" >&2
            exit 1
          fi
      - run: npm run check-types
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
